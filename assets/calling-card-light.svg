<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-label="陆玖叁 · 赛博拜帖">
  <defs>
    <linearGradient id="vdiv-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4D45" stop-opacity="0"/>
      <stop offset="22%" stop-color="#1E4D45" stop-opacity="0.28"/>
      <stop offset="78%" stop-color="#1E4D45" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E4D45" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E4D45" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1E4D45" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .serif { font-family: 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', Georgia, serif; }
      .mono  { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <!-- Subtle Xuan-paper card surface -->
  <rect x="8" y="8" width="864" height="232" rx="4" fill="#FAF8F4" stroke="#1E4D45" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="14" y="14" width="852" height="220" rx="2" fill="none" stroke="#1E4D45" stroke-opacity="0.08" stroke-width="0.75"/>

  <!-- Minimalist Chinese corner brackets (折角线) -->
  <g stroke="#1E4D45" stroke-width="1.6" fill="none" stroke-linecap="square" opacity="0.78">
    <path d="M8 22 V8 H22"/>
    <path d="M858 8 H872 V22"/>
    <path d="M8 226 V240 H22"/>
    <path d="M858 240 H872 V226"/>
  </g>

  <!-- Faint bamboo silhouette watermark (left bottom corner) -->
  <g stroke="#1E4D45" fill="none" opacity="0.055" stroke-linecap="round">
    <path d="M352 238 Q364 190 384 146" stroke-width="2"/>
    <path d="M366 196 Q344 186 328 192" stroke-width="1.3"/>
    <path d="M372 174 Q352 160 338 156" stroke-width="1.2"/>
    <path d="M376 168 Q390 154 396 142" stroke-width="1.1"/>
  </g>

  <!-- LEFT: 题签与朱砂方印 -->
  <text x="46" y="48" class="mono" font-size="11" fill="#5A726D" letter-spacing="2.2">NO. 693  ·  卷首题签</text>

  <!-- Name -->
  <text x="44" y="114" class="serif" font-size="44" font-weight="600" fill="#1C2321" letter-spacing="8">陆玖叁</text>

  <!-- Traditional Cinnabar Seal (朱砂阴文方印: 陆玖叁印) -->
  <g transform="translate(216, 75)">
    <rect x="0" y="0" width="40" height="40" rx="2.5" fill="#B83B32"/>
    <rect x="3" y="3" width="34" height="34" rx="1" fill="none" stroke="#FAF8F4" stroke-width="0.9" opacity="0.88"/>
    <!-- Subtle carved-stone edge notches -->
    <rect x="11" y="0" width="2.2" height="1.3" fill="#FAF8F4" opacity="0.7"/>
    <rect x="38.8" y="25" width="1.4" height="2.4" fill="#FAF8F4" opacity="0.65"/>
    <rect x="27" y="38.8" width="2" height="1.3" fill="#FAF8F4" opacity="0.65"/>
    <!-- Classic 2x2 right-to-left seal layout -->
    <text x="27.5" y="16.8" class="serif" font-size="12.5" font-weight="700" fill="#FAF8F4" text-anchor="middle">陆</text>
    <text x="27.5" y="31.8" class="serif" font-size="12.5" font-weight="700" fill="#FAF8F4" text-anchor="middle">玖</text>
    <text x="12.5" y="16.8" class="serif" font-size="12.5" font-weight="700" fill="#FAF8F4" text-anchor="middle">叁</text>
    <text x="12.5" y="31.8" class="serif" font-size="12.5" font-weight="700" fill="#FAF8F4" text-anchor="middle">印</text>
  </g>

  <!-- Accent divider + handle -->
  <rect x="46" y="135" width="20" height="2" rx="1" fill="#B83B32"/>
  <rect x="70" y="135.2" width="66" height="1.5" rx="0.75" fill="url(#accent-l)"/>
  <text x="146" y="140" class="mono" font-size="12" fill="#4B6661" letter-spacing="0.6">@says693</text>

  <!-- Motto -->
  <text x="46" y="178" class="serif" font-size="14.5" fill="#2A3634" letter-spacing="2.6">祝永入世而不入俗</text>
  <text x="46" y="204" class="serif" font-size="14.5" fill="#4E615E" letter-spacing="2.6">愿永幻想而亦理性</text>

  <!-- CENTER DIVIDER -->
  <line x1="398" y1="32" x2="398" y2="216" stroke="url(#vdiv-l)" stroke-width="1"/>
  <polygon points="398,120 401.5,124 398,128 394.5,124" fill="#B83B32" opacity="0.82"/>

  <!-- RIGHT: 赛博拜帖 (Cyber Calling Card) -->
  <text x="432" y="48" class="mono" font-size="12" fill="#1E4D45" font-weight="600">~$</text>
  <text x="454" y="48" class="mono" font-size="12" fill="#5A726D">cat ./693.card</text>
  <text x="836" y="48" class="serif" font-size="11.5" fill="#B83B32" text-anchor="end" letter-spacing="2">〔 赛博拜帖 〕</text>

  <line x1="432" y1="62" x2="836" y2="62" stroke="#1E4D45" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Key-Value Rows -->
  <g font-size="13.2">
    <!-- Row 1 -->
    <text x="432" y="92" class="serif" fill="#4A6B64" letter-spacing="3">名讳</text>
    <text x="480" y="91" class="mono" fill="#1E4D45" opacity="0.32">│</text>
    <text x="498" y="92" class="sans" fill="#1C2321" font-weight="500">陆玖叁</text>
    <text x="548" y="92" class="mono" font-size="12.2" fill="#637571">· says693</text>

    <!-- Row 2 -->
    <text x="432" y="119" class="serif" fill="#4A6B64" letter-spacing="3">器用</text>
    <text x="480" y="118" class="mono" fill="#1E4D45" opacity="0.32">│</text>
    <text x="498" y="119" class="mono" font-size="12.5" fill="#2A3634">TypeScript · JavaScript · AI Agents</text>

    <!-- Row 3 -->
    <text x="432" y="146" class="serif" fill="#4A6B64" letter-spacing="3">近务</text>
    <text x="480" y="145" class="mono" fill="#1E4D45" opacity="0.32">│</text>
    <text x="498" y="146" class="sans" fill="#2A3634">折页 FOLD · DSH 插件 · 开源汉化</text>

    <!-- Row 4 -->
    <text x="432" y="173" class="serif" fill="#4A6B64" letter-spacing="3">出没</text>
    <text x="480" y="172" class="mono" fill="#1E4D45" opacity="0.32">│</text>
    <text x="498" y="173" class="mono" font-size="12.5" fill="#2A3634">Bilibili · GitHub</text>

    <!-- Row 5 -->
    <text x="432" y="200" class="serif" fill="#4A6B64" letter-spacing="3">近况</text>
    <text x="480" y="199" class="mono" fill="#1E4D45" opacity="0.32">│</text>
    <circle cx="503" cy="195.5" r="3.5" fill="#2A7A6C"/>
    <circle cx="503" cy="195.5" r="6.5" fill="#2A7A6C" opacity="0.16"/>
    <text x="516" y="200" class="sans" fill="#2A3634">入世写码，留白造梦</text>
  </g>

  <!-- Subtle bottom-right code comment -->
  <text x="836" y="224" class="mono" font-size="10.5" fill="#7C8E8A" text-anchor="end">// ordinary, yet slightly strange — 693</text>
</svg>
