<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="陆玖叁 · 赛博拜帖">
  <defs>
    <linearGradient id="cdiv-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4D45" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1E4D45" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#1E4D45" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1E4D45" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif { font-family: 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', Georgia, serif; }
      .mono  { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <!-- Sleek horizontal Xuan-paper card -->
  <rect x="8" y="6" width="864" height="106" rx="4" fill="#FAF8F4" stroke="#1E4D45" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="13" y="11" width="854" height="96" rx="2" fill="none" stroke="#1E4D45" stroke-opacity="0.07" stroke-width="0.75"/>

  <!-- Corner brackets -->
  <g stroke="#1E4D45" stroke-width="1.4" fill="none" stroke-linecap="square" opacity="0.74">
    <path d="M8 19 V6 H21"/>
    <path d="M859 6 H872 V19"/>
    <path d="M8 99 V112 H21"/>
    <path d="M859 112 H872 V99"/>
  </g>

  <!-- Compact terminal header strip -->
  <text x="34" y="31" class="mono" font-size="11.5" fill="#1E4D45" font-weight="600">~$</text>
  <text x="54" y="31" class="mono" font-size="11.5" fill="#5A726D">cat ./693.card</text>
  <text x="190" y="31" class="mono" font-size="10.5" fill="#8A9C98">// ordinary, yet slightly strange</text>
  <text x="846" y="31" class="serif" font-size="11.5" fill="#B83B32" text-anchor="end" letter-spacing="2">〔 赛博拜帖 〕</text>

  <line x1="34" y1="42" x2="846" y2="42" stroke="#1E4D45" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Center column divider -->
  <line x1="444" y1="50" x2="444" y2="100" stroke="url(#cdiv-l)" stroke-width="1"/>

  <!-- 2x2 Key-Value Grid -->
  <g font-size="13">
    <!-- Left Column -->
    <text x="34" y="69" class="serif" fill="#4A6B64" letter-spacing="2.5">器用</text>
    <text x="79" y="68" class="mono" fill="#1E4D45" opacity="0.30">│</text>
    <text x="96" y="69" class="mono" font-size="12.2" fill="#222F2C">TypeScript · JavaScript · AI Agents</text>

    <text x="34" y="95" class="serif" fill="#4A6B64" letter-spacing="2.5">出没</text>
    <text x="79" y="94" class="mono" fill="#1E4D45" opacity="0.30">│</text>
    <text x="96" y="95" class="mono" font-size="12.2" fill="#222F2C">Bilibili · GitHub (@says693)</text>

    <!-- Right Column -->
    <text x="470" y="69" class="serif" fill="#4A6B64" letter-spacing="2.5">近务</text>
    <text x="515" y="68" class="mono" fill="#1E4D45" opacity="0.30">│</text>
    <text x="532" y="69" class="sans" fill="#222F2C">折页 FOLD · DSH 插件 · 开源汉化</text>

    <text x="470" y="95" class="serif" fill="#4A6B64" letter-spacing="2.5">近况</text>
    <text x="515" y="94" class="mono" fill="#1E4D45" opacity="0.30">│</text>
    <circle cx="537" cy="90.5" r="3.4" fill="#2A7A6C"/>
    <circle cx="537" cy="90.5" r="6.4" fill="#2A7A6C" opacity="0.16"/>
    <text x="550" y="95" class="sans" fill="#222F2C">入世写码，留白造梦</text>
  </g>
</svg>
