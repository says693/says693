  <rect x="8.5" y="8.5" width="415" height="91" rx="2" fill="none" stroke="#1E4D45" stroke-opacity="0.07" stroke-width="0.7"/>

  <!-- Diagonal minimalist Chinese corner brackets -->
  <g stroke="#1E4D45" stroke-width="1.4" fill="none" stroke-linecap="square" opacity="0.78">
    <path d="M4 16 V4 H16"/>
    <path d="M416 104 H428 V92"/>
  </g>

  <g transform="translate(20, 21)">
