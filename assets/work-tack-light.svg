    <rect x="2.6" y="2.6" width="26.8" height="26.8" rx="1.4" fill="none" stroke="#FAF8F4" stroke-width="0.8" opacity="0.86"/>
    <text x="16" y="21.5" class="serif" font-size="15.5" font-weight="700" fill="#FAF8F4" text-anchor="middle">折</text>
